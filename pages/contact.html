<main id="contact">
    <section class="contactl">
        <div>
            <p class="eyebrow">Contact</p>
            <h1>
                <span class="line"><span data-i18n="contact.title1">I'd love to</span></span>
                <span class="line"><span data-i18n="contact.title2"><em>hear</em> from you</span></span>
            </h1>
            <p class="lead" data-i18n="contact.lead">A school, an internship, a project or just a hello — my inbox is open.</p>
            <div class="buttons">
                <a href="../cv/eric-kimbembe-cv.pdf" class="button1 magnetic" data-i18n="btn.cv">My CV (PDF) <span aria-hidden="true">↗</span></a>
            </div>
        </div>
    </section>
    <section class="contactr">
        <h2 class="h2aft" data-i18n="contact.formTitle">Contact Me</h2>
        <form action="#" method="post" id="contact-form" novalidate>
            <label><span data-i18n="form.name">Full Name</span>
                <input type="text" name="name" placeholder="Enter your full name" data-i18n-placeholder="form.namePh" required>
                <small class="error" data-i18n="form.nameError">Please tell me your name.</small>
            </label>
            <label><span data-i18n="form.email">Email</span>
                <input type="email" name="email" placeholder="Enter your email" data-i18n-placeholder="form.emailPh" required>
                <small class="error" data-i18n="form.emailError">Please enter a valid email.</small>
            </label>
            <label class="full"><span data-i18n="form.subject">Subject</span>
                <input type="text" name="subject" placeholder="What is it about?" data-i18n-placeholder="form.subjectPh" required>
                <small class="error" data-i18n="form.subjectError">Please add a subject.</small>
            </label>
            <label class="full">Message
                <textarea name="message" rows="4" placeholder="Enter your message" data-i18n-placeholder="form.messagePh" required></textarea>
                <small class="error" data-i18n="form.messageError">Please write a short message.</small>
            </label>
            <label class="checkbox full">
                <input type="checkbox" name="consent" required>
                <span data-i18n="form.consent">I agree that my data can be used to respond to me.</span>
            </label>
            <button type="submit" class="button1 magnetic" data-i18n="form.send">Send message <span aria-hidden="true">→</span></button>
            <p class="form-note full" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
